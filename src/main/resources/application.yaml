spring:
  application:
    name: control-mapping-api
  datasource:
    url: jdbc:postgresql://${CONTROL_MAPPING_DB_HOST:localhost}:${CONTROL_MAPPING_DB_PORT:5432}/${CONTROL_MAPPING_DB_NAME:controls}?currentSchema=control_mappings
    username: ${CONTROL_MAPPING_DB_USERNAME:control_mapping_api}
    password: ${CONTROL_MAPPING_DB_PASSWORD:control_mapping_api}
  data:
    jdbc:
      dialect: postgresql
  flyway:
    schemas: control_mappings
    default-schema: control_mappings

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: control-mapping-api
    description: Inner API for control mappings (Controls database)
